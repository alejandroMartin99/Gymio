@if (open) {
  <div class="modal-backdrop" (click)="onCancel()">
    <div class="modal" (click)="$event.stopPropagation()">
      <h3>Selecciona entrenamiento</h3>
      <p>Elige uno para cargar nombre, ejercicios y series.</p>

      <div class="history-list">
        @for (record of records; track record.id) {
          <button
            type="button"
            [class.selected-option]="selectedId === record.id"
            (click)="onWorkoutSelected(record.id)"
          >
            {{ record.workout_name }}
          </button>
        }
      </div>

      <button
        type="button"
        class="primary"
        [disabled]="!selectedId || !confirmed || isLoading"
        (click)="onConfirm()"
      >
        Confirmar repetir rutina
      </button>

      <button type="button" class="close" (click)="onCancel()">Cerrar</button>
    </div>
  </div>
}
