@if (show) {
  <div class="routine-overlay">
    <video #vid class="routine-video" autoplay muted loop playsinline webkit-playsinline>
      <source src="Video/videoplayback.mp4" type="video/mp4">
    </video>
    <div class="routine-dim"></div>
    <div class="routine-center">
      <h1 class="routine-logo">GYMIO</h1>
      <p class="routine-label">Cargando rutina</p>
      <div class="routine-bar-wrap">
        <div class="routine-bar"></div>
      </div>
    </div>
  </div>
}
