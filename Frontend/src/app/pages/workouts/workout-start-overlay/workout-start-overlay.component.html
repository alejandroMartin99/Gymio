@if (show) {
  <div class="routine-start-overlay" role="alertdialog" aria-busy="true" aria-live="polite" aria-label="Iniciando rutina">
    <div class="routine-start-card">
      <div class="routine-video-stage">
        <video class="routine-video" autoplay muted loop playsinline>
          <source src="Video/videoplayback.mp4" type="video/mp4">
        </video>
        <div class="routine-video-overlay"></div>
        <div class="routine-video-content">
          <p class="routine-video-title">Cargando rutina</p>
          <div class="routine-bar-wrap">
            <div class="routine-bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
}
