@if (open) {
  <div class="modal-backdrop" (click)="onClose()">
    <div class="modal chart-modal" (click)="$event.stopPropagation()">

      <div class="chart-modal-header">
        <span class="chart-modal-title">{{ title }}</span>
        <button type="button" class="chart-modal-close" (click)="onClose()" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      @if (wChart().isEmpty && rChart().isEmpty) {
        <small class="note">No hay datos históricos para este ejercicio todavía.</small>
      } @else {

        <!-- ── Segmented tabs ─────────────────────────────── -->
        <div class="chart-section" [class.mode-weight]="activeTab === 'weight'" [class.mode-reps]="activeTab === 'reps'">

          <div class="chart-tabs" role="tablist">
            <button type="button" role="tab" class="chart-tab" [class.active]="activeTab === 'weight'" (click)="setTab('weight')" [attr.aria-selected]="activeTab === 'weight'">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true">
                <path d="M3 6h18M3 12h18M3 18h18"/>
              </svg>
              Peso (kg)
            </button>
            <button type="button" role="tab" class="chart-tab" [class.active]="activeTab === 'reps'" (click)="setTab('reps')" [attr.aria-selected]="activeTab === 'reps'">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                <polyline points="17 6 23 6 23 12"/>
              </svg>
              Reps
            </button>
          </div>

          <!-- ── Chart SVG ──────────────────────────────────── -->
          @if (!activeChart().isEmpty) {
            <svg class="history-svg" [attr.viewBox]="'0 0 ' + HC.cw + ' ' + HC.ch" aria-hidden="true">

              <!-- Grid lines + Y labels -->
              @for (g of activeChart().grid; track $index) {
                <line
                  [attr.x1]="HC.pl" [attr.y1]="g.y"
                  [attr.x2]="HC.cw - HC.pr" [attr.y2]="g.y"
                  class="grid-line"/>
                <text [attr.x]="HC.pl - 4" [attr.y]="g.y + 3.5"
                  text-anchor="end" font-size="7" fill="#9ca3af">{{ g.label }}</text>
              }

              <!-- X date labels -->
              @for (col of activeChart().columns; track $index) {
                <text [attr.x]="col.x" [attr.y]="HC.ch - 5"
                  text-anchor="middle" font-size="6.5" fill="#9ca3af">{{ col.dateLabel }}</text>
              }

              <!-- Vertical range bars (min→max within each session) -->
              @for (col of activeChart().columns; track $index) {
                @if (col.dots.length > 1) {
                  <line
                    [attr.x1]="col.x" [attr.y1]="col.rangeTopY"
                    [attr.x2]="col.x" [attr.y2]="col.rangeBotY"
                    class="range-bar" stroke-width="1.5" stroke-linecap="round"/>
                }
              }

              <!-- Trend line (connects max dots across sessions) -->
              @if (activeChart().trendPath) {
                <path [attr.d]="activeChart().trendPath"
                  fill="none" class="trend-line"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              }

              <!-- Dots (one per set per session) -->
              @for (col of activeChart().columns; track colIdx; let colIdx = $index) {
                @for (dot of col.dots; track dotIdx; let dotIdx = $index) {
                  <circle
                    [attr.cx]="dot.x" [attr.cy]="dot.y"
                    [attr.r]="dot.isMax ? 4 : 2.4"
                    [class.dot-max]="dot.isMax"
                    [class.dot-rest]="!dot.isMax"/>
                }
              }

            </svg>

            <!-- Legend -->
            <div class="chart-legend">
              <span class="legend-dot legend-dot--max"></span>
              <span class="legend-text">Máximo sesión</span>
              <span class="legend-dot legend-dot--rest"></span>
              <span class="legend-text">Otras series</span>
            </div>
          } @else {
            <p class="note note--chart">Sin datos de {{ activeTab === 'weight' ? 'peso' : 'repeticiones' }}.</p>
          }

        </div>
      }

      <button type="button" class="close" (click)="onClose()">Cerrar</button>
    </div>
  </div>
}
