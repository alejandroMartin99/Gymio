<div class="shell">
  <header class="header">
    <div class="brand">
      <h1>Gymio</h1>
      <p>{{ user.tagline }}</p>
    </div>

    <div class="profile-wrap">
      <button class="profile-btn" type="button" (click)="toggleProfileMenu()">
        <img [src]="user.photoUrl" alt="Foto de perfil" />
      </button>

      @if (profileMenuOpen) {
        <div class="profile-menu">
          <p>{{ user.name }}</p>
          <button type="button" (click)="logout()">Cerrar sesion</button>
        </div>
      }
    </div>
  </header>

  <main class="content" (click)="closeProfileMenu()">
    <router-outlet />
  </main>

  @if (activeWorkout.isActive()) {
    <div class="workout-overlay">
      <div class="workout-overlay__meta">
        <strong>{{ activeWorkout.workoutName() }}</strong>
        <span>Tiempo: {{ activeWorkout.elapsedLabel() }}</span>
      </div>
      <div class="workout-overlay__actions">
        <button type="button" class="text-cancel" (click)="cancelWorkout()">Cancelar</button>
        <button type="button" class="text-finish" (click)="finishWorkout()">Finalizar</button>
      </div>
    </div>
  }

  <nav class="bottom-nav">
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active">
        <span class="icon" aria-hidden="true">{{ item.icon }}</span>
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
